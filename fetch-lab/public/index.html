<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1">
  <title>Fetch Lab</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<main class="container py-4">
  <h1 class="mb-4">Fetch Lab</h1>
 
  <section id="hello-section" class="card mb-4">
    <div class="card-body">
      <h2 class="h4">1. Hello (text response)</h2>
      <button id="hello-btn"
        class="btn btn-primary">
        Fetch /hello
      </button>
      <div id="hello-result"
        class="alert alert-secondary mt-3 mb-0"
        role="alert">
        Click the button...
      </div>
      
    </div>
  </section>

  <section id="time-section" class = "card mb-4">
    <div class="card-body">
      <h2 class="h4">2. Time (json response)</h2>
      <button id="time-btn"
        class="btn btn-primary">
        Fetch /api/time
      </button>
      <div id="time-result"
        class="alert alert-secondary mt-3 mb-0"
        role="alert">
        Click the button...
      </div>
    </div>
  </section>

  <section id="greet-section" class="card mb-4">
    <div class="card-body">
      <h2 class="h4">3. Greet</h2>
      <input id="greet-input">
      <button id="greet-btn" class="btn btn-primary">
        Fetch /api/greet/:name
      </button>
      <div id="greet-result" class="alert alert-secondary mt-3 mb-0" role="alert">
        Click the button after an input...
      </div>
    </div>
  </section>
 
<section id="slow-btn" class="card mb-4">
    <div class="card-body">
      <h2 class="h4">4. Slow Button</h2>
      <button id="slow-btn" class="btn btn-primary">
        Fetch /api/slow
      </button>
      <div id="slow-result" class="alert alert-secondary mt-3 mb-0" role="alert">
        Click the button after an input...
      </div>
    </div>
  </section>

  <section id="form-section" class="card mb-4">
    <div class="card-body">
      <h2 class="h4">5. Author & Text Form</h2>
      <label for="Author">Name:</label>
      <input type="text" id="msg-author" placeholder="">
      <label for="Text">Name:</label>
      <input type="text" id="msg-text" placeholder="">
      <button id="form-btn">Submit</button>
      <div id="form-result" class="alert alert-secondary mt-3 mb-0" role="alert">
        Submit your form...
      </div>
    </div>
  </section>

  <section id="fetch-section" class="card mb-4">
    <div class="card-body">
      <h2 class="h4">5. Fetch Form</h2>
      <label for="Author">Name:</label>
      <input type="text" id="fetch-author" placeholder="">
      <label for="Text">Name:</label>
      <input type="text" id="fetch-text" placeholder="">
      <button id="fetch-btn">Submit</button>
      <div id="fetch-result" class="alert alert-secondary mt-3 mb-0" role="alert">
        Submit your fetch...
      </div>
    </div>
  </section>

  <!-- You will add more sections below -->
 
  <script>

    // Put this near the top of your <script> tag
    function statusCheck(response) {
      if (response.ok) return response;
      // Try to read JSON error bodies like { error: "..." }
      return response.json()
        .then(errData => {
          const msg = errData.error || ('HTTP ' + response.status);
          throw new Error(msg);
        })
        .catch(() => {
          // If the response wasn’t JSON, fall back to a generic message
          throw new Error('HTTP ' + response.status);
        });
    }

    // B.1

    document.getElementById('hello-btn')
    .addEventListener('click', () => {
      fetch('/hello')
        .then(statusCheck)
        .then(response => response.text())
        .then(text => {
          document.getElementById('hello-result').textContent = text;
        })
        .catch(error => {
          document.getElementById('hello-result').textContent = 'Error: ' + error.message;
        });
    });

    // B.2
    /**
        document.getElementById('time-btn')
        .addEventListener('click', () => {
        
          fetch('/api/time')
            .then(statusCheck)
            .then(response => response.json())
            .then(text => {
              document.getElementById('time-result').textContent = JSON.stringify(text);
            })
            .catch(error => {
              document.getElementById('time-result').textContent = 'Error: ' + error.message;
            });
          
        })
    */

    // C.1
    document.getElementById('time-btn')
    .addEventListener('click', async () => {
      try {
        const response =
          await fetch('/api/time');
        await statusCheck(response);
        const data =
          await response.json();
        document.getElementById(
          'time-result').textContent =
            data.message + ': '
            + data.currentTime;
      } catch (error) {
        document.getElementById(
          'time-result').textContent =
            'Error: ' + error.message;
      }
    });


    // B.3
    
    document.getElementById('greet-btn').addEventListener('click', () => {
        const name = document.getElementById('greet-input').value;
        fetch('/api/greet/' + name)
          .then(statusCheck)
          .then(res => res.json())
          .then(data => {
            document.getElementById('greet-result').textContent = data.greeting;
            /* display data.greeting */
          })
          .catch(error => {
            document.getElementById('greet-result').textContent = 'Error: ' + error.message;
            /* handle error */
          });
      });

      // B.4

      document.getElementById('slow-btn')
        .addEventListener('click', () => {
        const resultDiv =
          document.getElementById('slow-result');
        resultDiv.textContent =
          'Loading... please wait';
        resultDiv.className =
          'alert alert-secondary mt-3';
    
        fetch('/api/slow')
          .then(statusCheck)
          .then(res => res.json())
          .then(data => {
            resultDiv.textContent = data.message;
            resultDiv.className =
              'alert alert-success mt-3';
          })
          .catch(error => {
            resultDiv.textContent =
              'Error: ' + error.message;
            resultDiv.className =
              'alert alert-danger mt-3';
          });
      });

      // C.2

      async function postMessage() {
      const text = document.getElementById(
        'msg-text').value;
      const author = document.getElementById(
        'msg-author').value;
      try {
        const response = await fetch(
          '/api/messages', {
            method: 'POST',
            headers: {
              'Content-Type':
                'application/json'
            },
            body: JSON.stringify(
              { text, author })
        });
        if (!response.ok) {
          const errData =
            await response.json();
          throw new Error(errData.error);
        }
        const newMsg =
          await response.json();
        document.getElementById("form-result").textContent = JSON.stringify(newMsg);
        // Display the newly created message
      } catch (error) {
        document.getElementById("form-result").textContent =JSON.stringify(errData);
        // Display error
      }
    }

    document.getElementById("form-btn").addEventListener('click', postMessage);

    // D.3

    document.getElementById("fetch-btn").addEventListener('click', () => {
      let fetchResult = document.getElementById("fetch-result");
      fetch('https://api.hooklistener.com/anon/5d899311-e082-4fed-b7b5-5c1ad8b856d5', postMessage)
      .then(statusCheck)
      .then(res => res.json())
      .then(data => { 
        fetchResult.textContent = data.message;
        fetchResult.className =
        'alert alert-success mt-3';
      })
      .catch(error => {
        fetchResult.textContent = 'Error: ' + error.message;
        fetchResult.className = 'alert alert-danger mt-3';
      });
    });

    

  </script>
</main>
</body>
</html>
